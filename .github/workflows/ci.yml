name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run lint
      # Asserts the VALUES of the request bodies the create wizard builds, which
      # is what a typecheck cannot see: a Helm overlay scoped to the wrong key is
      # discarded silently (defect D3), and a hardcoded chart name or image
      # digest produces a perfectly well-typed request that deploys the wrong
      # application (defect D4).
      - name: request-contract
        run: npm run check:contract
      # Executes the container entrypoint on this runner and loads its output
      # with node. A shell script shipped in one slice and first run in another
      # is how the certificate CronJob reached production with no shell in its
      # image; here the failure would be quieter still — a malformed config.js
      # leaves the SPA silently serving build-time configuration.
      - name: entrypoint-contract
        run: npm run check:entrypoint
      - name: build
        run: npm run build

  chart:
    name: helm lint + unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.3
      - name: helm lint
        run: helm lint deploy/chart
      # ArgoCD renders this chart with no human in the loop, so a template that
      # cannot render is an outage rather than a failed command. The suite also
      # pins the two rules that are otherwise only prose: the image reference
      # must be a digest (the chart REFUSES a tag — defect D7 ran the wrong
      # repository's code from a mutable reference), and a null config value
      # must be OMITTED from the ConfigMap while an empty string is KEPT, which
      # is what makes an empty orchestrator URL mean same-origin rather than
      # unconfigured.
      - name: helm unittest
        run: helm unittest deploy/chart
