name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run lint
      # Asserts the VALUES of the request bodies the create wizard builds, which
      # is what a typecheck cannot see: a Helm overlay scoped to the wrong key is
      # discarded silently (defect D3), and a hardcoded chart name or image
      # digest produces a perfectly well-typed request that deploys the wrong
      # application (defect D4).
      - name: request-contract
        run: npm run check:contract
      # Executes the container entrypoint on this runner and loads its output
      # with node. A shell script shipped in one slice and first run in another
      # is how the certificate CronJob reached production with no shell in its
      # image; here the failure would be quieter still — a malformed config.js
      # leaves the SPA silently serving build-time configuration.
      - name: entrypoint-contract
        run: npm run check:entrypoint
      - name: build
        run: npm run build
