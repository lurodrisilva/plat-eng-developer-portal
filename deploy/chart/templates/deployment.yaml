apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "developer-portal.fullname" . }}
  labels:
    {{- include "developer-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "developer-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Configuration is read ONCE, by the entrypoint, at container start. A
        # ConfigMap change is therefore invisible to a running pod — no reload,
        # no re-render, no error. Without this checksum the pods would keep
        # serving the previous configuration indefinitely while ArgoCD reported
        # Synced and Healthy, which is the quietest failure available here.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "developer-portal.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: portal
          image: {{ include "developer-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # Every key of the ConfigMap becomes an environment variable, which is
          # what the entrypoint reads. envFrom rather than a projected file: the
          # image renders config from the environment in every other context
          # too, and a chart that bypassed that would leave the entrypoint
          # untested in the one environment that matters.
          envFrom:
            - configMapRef:
                name: {{ include "developer-portal.fullname" . }}-config
          # Liveness asks whether nginx is up. Readiness asks the question that
          # actually matters — did the configuration render? A pod serving
          # index.html with no config.js looks perfectly healthy and signs
          # nobody in, so it must not receive traffic.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /config.js
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # THREE writable mounts, not one. readOnlyRootFilesystem is only
          # survivable because each path nginx-unprivileged writes to is backed
          # by an emptyDir: it keeps its pid and every temp path under /tmp, it
          # writes /var/cache/nginx, and the entrypoint renames config.js into
          # /etc/portal. Miss any and the container crash-loops at start —
          # loudly, which is the right failure for this.
          volumeMounts:
            - name: portal-config
              mountPath: /etc/portal
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: portal-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
