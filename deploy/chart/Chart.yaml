apiVersion: v2
name: developer-portal
description: >-
  The xp.dev Developer Portal — the human entrance to the paved road, served on
  the platform's public origin (ADR-0024). Deployed by ArgoCD from this
  repository; the image it runs is pinned by digest, never by tag.
type: application

# Chart version. Bumped for chart changes; a new image is a values change (the
# digest) and bumps this too, because ArgoCD tracks this path and the digest is
# the only thing that decides which code runs.
version: 0.1.0

# The image tag this chart's default digest corresponds to. Informational — the
# digest in values.yaml is authoritative, and the chart refuses to render from a
# tag at all.
appVersion: "sha-b14a584"

home: https://github.com/lurodrisilva/plat-eng-developer-portal
sources:
  - https://github.com/lurodrisilva/plat-eng-developer-portal
