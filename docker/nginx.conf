# Developer portal — static SPA server (slice P4).
#
# Replaces the base image's default.conf. Port 8080 because the runtime user is
# UID 101 and cannot bind a privileged port; P5's Service targets 8080.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The bundle is ~900 kB raw and ~257 kB gzipped, and it sits in front of
    # sign-in. Serving it uncompressed triples the bytes on the first paint.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Runtime configuration, served from OUTSIDE the webroot. The entrypoint
    # renders it at container start into a directory the runtime user owns,
    # which keeps the webroot itself read-only to the running process.
    #
    # no-store is load-bearing: this file is what makes one image serve any
    # environment, so a cached copy would pin a browser to the configuration of
    # whichever environment it loaded first. A 404 here means the entrypoint did
    # not run — the SPA then falls back to build-time values and signs nobody
    # in, which is what P8's gate looks for.
    location = /config.js {
        alias /etc/portal/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed filenames — safe to cache forever, and the only way the SPA loads
    # fast on a repeat visit.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The API is NOT served from this container — it is a separate workload
    # published on the same origin by its own HTTPRoute (ADR-0024, slice P6).
    # nginx only ever sees a request here when no more-specific /api/v1 route is
    # attached to the Gateway: before P6 lands, or if that route is later
    # detached or fails to resolve its backend.
    #
    # Without this block such a request falls through to the SPA history
    # fallback below and comes back as **200 with index.html**. A fetch() then
    # passes its `res.ok` check and dies inside `await res.json()` with
    # "Unexpected token '<'", which reads as a bug in the portal rather than as
    # a missing route. 404 names the actual fault.
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"no API is published at this origin"}';
    }
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"no API is published at this origin"}';
    }

    # Liveness that does not depend on the SPA. The readiness question — did the
    # configuration render? — is answered by /config.js, not here.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # SPA history fallback. A deep link like /apps/orders/deploy is a client
    # route with no file behind it; without this it 404s, which is how a portal
    # that works when you click through breaks when you paste a URL or reload.
    #
    # index.html itself is never cached: it names the hashed asset bundle, so a
    # cached copy keeps loading the previous release's JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
