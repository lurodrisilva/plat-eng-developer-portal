# Response headers every location must carry.
#
# THIS IS AN INCLUDE BECAUSE add_header DOES NOT MERGE. nginx inherits
# add_header directives from an enclosing block ONLY while the inner block
# declares none of its own; the moment a location adds one — every location here
# sets Cache-Control — the whole inherited set is dropped. Server-level security
# headers would silently vanish from exactly the responses that matter. So each
# location includes this file rather than relying on inheritance.

add_header X-Content-Type-Options "nosniff" always;

# SAMEORIGIN, NEVER DENY. MSAL renews tokens silently through a hidden iframe
# that navigates to Entra and then back to redirectUri — this origin, framed by
# this origin. DENY blocks that return leg, and the failure is quiet: interactive
# sign-in still works, background polls just stop getting tokens until the
# session visibly lapses.
add_header X-Frame-Options "SAMEORIGIN" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No Content-Security-Policy yet, deliberately. A correct one has to enumerate
# the Entra authorize/token endpoints this SPA talks to, and a wrong one breaks
# sign-in in a way that looks like an Entra problem rather than a header
# problem. It belongs in a slice that can prove it against a real sign-in.
